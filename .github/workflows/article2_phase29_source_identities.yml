name: article2-phase29-original-source-identities
on:
  push:
    branches: [research/monitoring-v6-independent-cohort]
    paths: [.github/workflows/article2_phase29_source_identities.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-source-gated-cases:
    strategy:
      fail-fast: false
      matrix:
        case: [cohort28_02, cohort28_09, cohort28_10, cohort28_13]
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned Parquet decoder
        run: python -m pip install --disable-pip-version-check pyarrow==19.0.1
      - name: Recover exactly selected historical transaction identities from original AWS
        run: |
          python papers/monitoring_jss/phase29/selected_original_tx.py \
            --case ${{ matrix.case }} --out phase29_out/${{ matrix.case }}
      - name: Preserve audit result (no raw source payloads, labels or detector outputs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article2-phase29-ids-${{ matrix.case }}
          path: |
            phase29_out/${{ matrix.case }}/source_identity_manifest.json
            phase29_out/${{ matrix.case }}/selected_tx_identities.jsonl.gz
          if-no-files-found: warn
          retention-days: 30
