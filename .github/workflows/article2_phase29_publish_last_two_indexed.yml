name: article2-phase29-publish-omni-schnoodle
on:
  push:
    branches: [research/monitoring-v6-independent-cohort]
    paths: [.github/workflows/article2_phase29_publish_last_two_indexed.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Fetch complete source-bound original indexed event data from successful exact runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p raw/cohort28_10 raw/cohort28_13
          gh run download 40927014642 -n article2-phase29-indexed-cohort28_10-complete -D raw/cohort28_10
          gh run download 40926526133 -n article2-phase29-indexed-cohort28_13-complete -D raw/cohort28_13
      - name: Independently hash and count check all source-linked observations before permanent publication
        run: |
          set -euo pipefail
          for case in cohort28_10 cohort28_13; do
            out=papers/monitoring_jss/phase29/indexed/$case
            mkdir -p "$out"
            python papers/monitoring_jss/phase29/verify_indexed.py \
              --case "$case" \
              --original-dir papers/monitoring_jss/phase29/data/$case \
              --indexed-dir raw/$case \
              --out "$out/independent_verification.json"
            cp raw/$case/{acquisition_manifest.json,indexer_observations.jsonl.gz,indexer_response_receipts.json} "$out/"
          done
      - name: Publish bounded derived on-chain event features and source receipt hashes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/monitoring_jss/phase29/indexed
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Phase29: archive source-matched and independently checked Omni and Schnoodle event observations'
            git push origin HEAD:research/monitoring-v6-independent-cohort
          fi
