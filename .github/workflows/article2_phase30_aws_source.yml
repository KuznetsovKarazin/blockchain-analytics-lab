name: article2-phase30-original-aws-source-selected-ids
on:
  push:
    branches: [research/monitoring-v6-independent-cohort]
    paths: [.github/workflows/article2_phase30_aws_source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-three-candidate-label-free-source:
    strategy:
      fail-fast: false
      matrix:
        case: [cohort28_07, cohort28_11, cohort28_14]
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==19.0.1
      - name: Independently reconstruct all selected TX source identities across all row groups
        run: |
          python papers/monitoring_jss/phase29/selected_original_tx.py \
            --case ${{ matrix.case }} --out raw_source/${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article2-phase30-original-${{ matrix.case }}
          path: |
            raw_source/${{ matrix.case }}/source_identity_manifest.json
            raw_source/${{ matrix.case }}/selected_tx_identities.jsonl.gz
          if-no-files-found: warn
          retention-days: 30
