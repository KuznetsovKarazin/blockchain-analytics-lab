name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q

  integration:
    # the studies import the pinned companion package `bal`; run the path
    # load_elliptic -> models -> thresholds on a tiny fixture with that pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the bal extra (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,bal]"
      - name: Integration test
        run: pytest -q tests/test_bal_integration.py -rs
      - name: The bal test must not be skipped here
        run: python -c "import bal.data.elliptic, bal.models.tabular, bal.eval.metrics"
