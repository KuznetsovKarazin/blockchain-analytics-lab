name: article2-v7-review-reproducibility-release
on:
  push:
    branches: [research/monitoring-v7-review-audit-20261029]
    paths:
      - .github/workflows/article2_v7_review_release.yml
      - papers/monitoring_jss/jss_latex_v7_review/**
      - papers/monitoring_jss/phase31/**
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: article2-v7-review-release
  cancel-in-progress: false
jobs:
  verify-build-release:
    if: github.ref == 'refs/heads/research/monitoring-v7-review-audit-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an unpublished release tag before any publication
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/tags/article2-jss-v7-2026-10-29; then
            echo 'V7 is already published. Preserve the immutable tag and use a new version for further revisions.'
            exit 1
          fi
      - name: Offline scientific reproduction from a clean checkout
        run: |
          set -euo pipefail
          python papers/monitoring_jss/phase31/verify_release.py --out /tmp/v7_release_audit.json
          git diff --exit-code -- papers/monitoring_jss/phase16 papers/monitoring_jss/phase18 papers/monitoring_jss/phase21 papers/monitoring_jss/phase23 papers/monitoring_jss/phase25 papers/monitoring_jss/phase26 papers/monitoring_jss/phase28 papers/monitoring_jss/phase29 papers/monitoring_jss/phase30
      - name: Install LaTeX and pin the official Elsevier class
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-bibtex-extra texlive-fonts-recommended lmodern poppler-utils >/dev/null
          git clone -q https://github.com/STM-Document-Engineering/elsarticle.git /tmp/elsarticle
          git -C /tmp/elsarticle checkout -q 04aee43a9049051128c5d58b617dcd05e34df8b4
      - name: Compile exact article source and create portable package
        working-directory: papers/monitoring_jss/jss_latex_v7_review
        env:
          TEXINPUTS: /tmp/elsarticle//:
          BSTINPUTS: /tmp/elsarticle//:
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > /tmp/v7_latex1.log
          bibtex8 main > /tmp/v7_bibtex.log
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > /tmp/v7_latex2.log
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > /tmp/v7_latex3.log
          ! grep -E 'Citation .* undefined|There were undefined references|There were multiply-defined labels|Overfull' main.log
          python ../phase31/package_release.py --source-commit "$GITHUB_SHA" --audit /tmp/v7_release_audit.json
          pdfinfo main.pdf | grep '^Pages:'
      - uses: actions/upload-artifact@v4
        with:
          name: article2-v7-verified-manuscript-and-audits
          path: |
            papers/monitoring_jss/jss_latex_v7_review/Article2_JSS_V7_LaTeX_PDF.zip
            papers/monitoring_jss/jss_latex_v7_review/main.pdf
            papers/monitoring_jss/jss_latex_v7_review/PDF_SHA256.txt
            papers/monitoring_jss/jss_latex_v7_review/RELEASE_MANIFEST.json
            /tmp/v7_release_audit.json
            /tmp/v7_latex3.log
          if-no-files-found: error
          retention-days: 90
      - name: Preserve verified build and create a new immutable tag
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git show-ref --verify --quiet refs/tags/article2-jss-v7-2026-10-29; then
            echo 'Release tag appeared during verification; refusing to mutate the branch or tag.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/monitoring_jss/jss_latex_v7_review/main.pdf papers/monitoring_jss/jss_latex_v7_review/Article2_JSS_V7_LaTeX_PDF.zip papers/monitoring_jss/jss_latex_v7_review/PDF_SHA256.txt papers/monitoring_jss/jss_latex_v7_review/RELEASE_MANIFEST.json papers/monitoring_jss/jss_latex_v7_review/REPRODUCTION_REPORT.json papers/monitoring_jss/jss_latex_v7_review/REVIEW_RESPONSE_RU.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Article2 V7: preserve independently verified review revision and compiled paper'
            git push origin HEAD:research/monitoring-v7-review-audit-20261029
          fi
          tag=article2-jss-v7-2026-10-29
          git tag -a "$tag" -m 'V7: source-audited review revision, independent offline checks and complete second-wave raw observations'
          git push origin "refs/tags/$tag"
