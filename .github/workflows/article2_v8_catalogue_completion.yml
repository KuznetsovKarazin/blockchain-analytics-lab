name: article2-v8-catalogue-completion
on:
  push:
    branches: [research/monitoring-v8-final-review-20261030]
    paths:
      - .github/workflows/article2_v8_catalogue_completion.yml
      - papers/monitoring_jss/phase32/census_completion/source_census.py
      - papers/monitoring_jss/phase32/census_completion/CANDIDATE_FRAME.json
      - papers/monitoring_jss/phase32/census_completion/FORK_WINDOWS.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: article2-v8-catalogue-completion
  cancel-in-progress: false
jobs:
  census:
    if: github.ref == 'refs/heads/research/monitoring-v8-final-review-20261030'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact decoder
        run: python -m pip install --disable-pip-version-check pyarrow==19.0.1
      - name: Acquire fixed original source census without labels
        run: python papers/monitoring_jss/phase32/census_completion/source_census.py --batch ${{ matrix.batch }} --output census_batch_${{ matrix.batch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article2-phase32-census-batch-${{ matrix.batch }}
          path: |
            census_batch_${{ matrix.batch }}/source_census.json
            census_batch_${{ matrix.batch }}/range_session/
            census_batch_${{ matrix.batch }}/listings/
            census_batch_${{ matrix.batch }}/source_manifests/
            census_batch_${{ matrix.batch }}/selected_coordinates/
          if-no-files-found: error
          retention-days: 90
  preserve:
    needs: census
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: article2-phase32-census-batch-*
          path: acquired_census
      - name: Validate complete batches and preserve exact acquired evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,shutil
          out=Path('papers/monitoring_jss/phase32/census_completion/results')
          out.mkdir(exist_ok=True)
          for batch in range(4):
              folder=Path('acquired_census')/f'article2-phase32-census-batch-{batch}'
              matches=list(folder.rglob('source_census.json'))
              assert len(matches)==1,(batch,matches)
              source=matches[0].parent
              x=json.loads(matches[0].read_text())
              assert x['batch']==batch and x['status']=='COMPLETE_SOURCE_CENSUS'
              assert x['complete_cases']==(1 if batch==3 else 2)
              shutil.copytree(source,out/f'batch_{batch}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c research/monitoring-v8-census-results-20261030
          git add papers/monitoring_jss/phase32/census_completion/results
          git diff --cached --check
          git commit -m 'Preserve seven complete fixed catalogue-completion source windows for independent audit'
          git push origin HEAD:refs/heads/research/monitoring-v8-census-results-20261030
