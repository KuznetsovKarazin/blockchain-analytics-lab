name: article2-jss-v4-latex
on:
  push:
    branches: [research/monitoring-applicability-20261029]
    paths:
      - 'papers/monitoring_jss/jss_latex_v4/**'
      - '.github/workflows/article2_jss_v4_latex.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-publishers texlive-bibtex-extra texlive-fonts-recommended texlive-science poppler-utils >/dev/null
      - name: Build Elsevier PDF and check references
        working-directory: papers/monitoring_jss/jss_latex_v4
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > pdflatex1.log
          bibtex8 main > bibtex.log 2>&1 || { test -s main.bbl || { cat bibtex.log; exit 1; }; }
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > pdflatex2.log
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > pdflatex3.log
          test -s main.pdf
          ! grep -E 'Citation .* undefined|There were undefined references' main.log
          pdfinfo main.pdf | grep '^Pages:'
      - name: Upload independently compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: article2-jss-v4-pdf
          path: papers/monitoring_jss/jss_latex_v4/main.pdf
          if-no-files-found: error
          retention-days: 30
