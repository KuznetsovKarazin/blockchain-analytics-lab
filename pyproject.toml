[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-analytics-lab"
version = "0.1.0"
description = "Reproducible studies of blockchain security data: threats, preprocessing, transaction patterns, streaming monitoring and federated detection"
authors = [{ name = "Oleksandr Kuznetsov", email = "oleksandr.kuznetsov@uniecampus.it" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pandas>=2.2", "pyarrow>=15", "scipy>=1.13", "scikit-learn>=1.5",
                "lightgbm>=4.3", "matplotlib>=3.8", "networkx>=3.2", "statsmodels>=0.14",
                "threadpoolctl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Elliptic loader and evaluation helpers are reused from the public companion project
bal = ["blockchain-detector-eval @ git+https://github.com/KuznetsovKarazin/blockchain-detector-eval@07c01f52b52b07649191d94e272183c1559a71e5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
